<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sobre - LuzCâmeraAção</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
  <header class="navbar">
    <div class="logo" onclick="window.location.href='/index.html'">
      <img src="../assets/images/logo_doro.svg" alt="" class="logo_img">
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../pages/explorar.html">Explorar</a>
      <a href="../pages/favoritos.html">Favoritos</a>
      <a href="../pages/sobre.html" class="active">Sobre</a>
    </nav>
    <div class="actions">
      <input 
        type="text" 
        id="searchInput" 
        placeholder=" Buscar filmes..." 
        class="search-bar"
      >
      <button class="search-btn" onclick="buscar()">Buscar</button>
      <span class="user-name" style="color: white; margin: 0 15px;">Rodrigo</span>
    </div>
  </header>

  <main>
    <h2>Conheça os Desenvolvedores</h2>
    <div class="profiles">
      <div class="profile-card">
        <h3>Rodrigo Bolgheroni</h3>
        <p>Desenvolvedor, programador desde os 7 anos.</p>
        <button class="btn-profile" onclick="window.location.href='../pages/sobre-rodrigo/index.html'">
          Ver Perfil
        </button>
      </div>

      <div class="profile-card">
        <h3>Luis Henrique</h3>
        <p>Desenvolvedor criativo desde os 10 anos</p>
        <button class="btn-profile" onclick="window.location.href='../pages/sobre-luis/index.html'">
          Ver Perfil
        </button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 LuzCâmeraAção. Todos os direitos reservados.</p>
  </footer>

  <script>
    function buscar() {
      const termo = document.getElementById("searchInput").value.trim();
      if (termo) {
        window.location.href = `../pages/explorar.html?query=${encodeURIComponent(termo)}`;
      } else {
        window.location.href = `../pages/explorar.html`;
      }
    }
  </script>
</body>
</html>
