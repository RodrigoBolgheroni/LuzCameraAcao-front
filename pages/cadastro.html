<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuzCâmeraAção - Cadastro</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="overlay">
    <form class="register-box">
      <div class="header">
        <h1 class="logo">LuzCâmeraAção</h1>
      </div>

      <h2>Crie sua conta</h2>

      <label>Usuário</label>
      <input type="text" placeholder="Nome de usuário" required />

      <label>E-mail</label>
      <input type="email" placeholder="Seu e-mail" required />

      <label>Senha</label>
      <input type="password" placeholder="Senha" required />

      <label>Confirmar senha</label>
      <input type="password" placeholder="Confirme a senha" required />

      <div class="terms">
        <input type="checkbox" id="agree" required />
        <label for="agree">
          Concordo com a <a href="#">Política de Privacidade</a> e os
          <a href="#">Termos de Uso</a>.
        </label>
      </div>

      <button type="submit" class="continue-btn">Continuar</button>

      <p class="login-text">
        Já tem uma conta? <a href="../index.html">Entrar</a>
      </p>
    </form>
  </div>
</body>
</html>
