<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuzCâmeraAção - Login</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="overlay">
    <form class="register-box">
      <div class="header">
        <h1 class="logo">LuzCâmeraAção</h1>
      </div>

      <h2>Entrar na conta</h2>

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Seu e-mail" required />

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Sua senha" required />

      <div class="options">
        <label class="remember">
          <input type="checkbox" /> Lembrar de mim
        </label>
        <a href="#" class="forgot">Esqueci a senha</a>
      </div>

      <button type="submit" class="continue-btn">Entrar</button>

      <p class="login-text">
        Ainda não tem uma conta? <a href="/pages/cadastro.html">Cadastrar-se</a>
      </p>
    </form>
  </div>
</body>
</html>
